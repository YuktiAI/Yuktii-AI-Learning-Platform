services:
  - type: web
    name: yuktii-eval-worker
    runtime: node
    rootDir: evaluation-worker
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVALUATION_PASS_SCORE
        value: "50"


